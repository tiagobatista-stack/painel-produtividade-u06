name: Qualidade

# Executa no servidor do GitHub a cada push na main e a cada Pull Request, independentemente do computador de quem escreveu o código.
# A Vercel publica; este fluxo verifica. Sem segredos e com permissão mínima.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regras:
    name: Regras (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Motor de prioridade (T1–T13), planilha, operações, exportações, MCP local e build.
      - run: npm run quality

  navegador:
    name: Navegador (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Constrói public/, serve o resultado e roda os testes e2e (desktop e mobile).
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Guardar o relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 14
      - name: Guardar capturas, vídeos e traces das falhas
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-das-falhas
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

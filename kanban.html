<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban de projetos</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/kanban.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <div class="topo-titulo">
        <h1>Kanban de projetos</h1>
        <p class="aviso">Exemplo didático com dados fictícios.</p>
      </div>
      <button type="button" id="novo-card" class="primario">Novo card</button>
    </div>
    <div class="referencia">
      <label for="data-referencia">Data de referência</label>
      <input type="date" id="data-referencia">
      <button type="button" id="usar-data-seed">Usar data do exemplo</button>
      <a class="link-topo" href="index.html">Painel de demandas</a>
    </div>
  </header>

  <main>
    <p id="erro" class="erro" role="alert" hidden></p>
    <p id="mensagem" class="sucesso" role="status" hidden></p>

    <section class="aba" aria-label="Quadro">
      <div class="fila-cabecalho">
        <h2 id="titulo-fila" tabindex="-1">Quadro</h2>
        <div class="botoes-cabecalho">
          <button type="button" id="restaurar-exemplo">Restaurar exemplo</button>
        </div>
      </div>

      <form id="filtros-kanban" class="filtros" role="search" aria-label="Buscar e filtrar cards">
        <div class="campo">
          <label for="k-busca">Buscar</label>
          <input type="search" id="k-busca" placeholder="Título, descrição ou número…" autocomplete="off">
        </div>
        <div class="campo">
          <label for="k-prioridade">Prioridade</label>
          <select id="k-prioridade"></select>
        </div>
        <div class="campo">
          <label for="k-prazo">Prazo</label>
          <select id="k-prazo"></select>
        </div>
        <div class="campo">
          <label for="k-status">Status</label>
          <select id="k-status"></select>
        </div>
        <div class="campo campo-acao">
          <button type="button" id="k-limpar" disabled>Limpar filtros</button>
        </div>
      </form>

      <p id="contagem" class="nota" aria-live="polite"></p>
      <p id="quadro-vazio" hidden>Nenhum card encontrado.</p>
      <div id="kanban-grade" class="kanban-grade" role="group" aria-label="Quadro com quatro colunas"></div>
      <p id="quadro-anuncio" class="so-leitor" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="dialogo-card" aria-labelledby="card-titulo-dialogo">
    <form id="form-card" novalidate>
      <h2 id="card-titulo-dialogo">Novo card</h2>
      <p class="nota">Use apenas dados fictícios: a publicação na internet é pública.</p>
      <div id="resumo-erros" class="erro" role="alert" tabindex="-1" hidden></div>

      <div class="campo">
        <label for="f-titulo">Título</label>
        <input id="f-titulo" name="titulo" maxlength="120" autocomplete="off">
        <span class="erro-campo" id="e-titulo"></span>
      </div>
      <div class="campo">
        <label for="f-descricao">Descrição</label>
        <textarea id="f-descricao" name="descricao" rows="3" maxlength="500"></textarea>
        <span class="erro-campo" id="e-descricao"></span>
      </div>
      <div class="campo">
        <label for="f-prioridade">Prioridade</label>
        <select id="f-prioridade" name="prioridade"></select>
        <span class="erro-campo" id="e-prioridade"></span>
      </div>
      <div class="campo">
        <label for="f-prazo">Prazo (opcional)</label>
        <input id="f-prazo" name="prazo" type="date">
        <span class="erro-campo" id="e-prazo"></span>
      </div>
      <div class="campo">
        <label for="f-status">Status</label>
        <select id="f-status" name="status"></select>
        <span class="erro-campo" id="e-status"></span>
      </div>

      <details id="card-historico" class="motivos" hidden>
        <summary>Histórico</summary>
        <ul></ul>
      </details>

      <div class="acoes">
        <button type="button" id="excluir-card" class="perigo" hidden>Excluir</button>
        <button type="submit" class="primario">Salvar</button>
        <button type="button" id="cancelar-card">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/kanban-app.js"></script>
</body>
</html>

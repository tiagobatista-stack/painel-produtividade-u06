# Ilustrativo (slide 44 da aula): o projeto não usa GitLab. Mostra o mesmo pipeline do GitHub Actions
# escrito para o GitLab CI, para comparar Pull Request × Merge Request e .github/workflows × .gitlab-ci.yml.
stages:
  - qualidade

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

regras:
  stage: qualidade
  image: node:22
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run quality

navegador:
  stage: qualidade
  image: mcr.microsoft.com/playwright:v1.63.0-noble # mesma versão do @playwright/test
  variables:
    CI: 'true'
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/
